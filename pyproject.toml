[project]
name = "circular-ring-buffer"
version = "0.1.0"
description = "A fixed-capacity deque wrapper that stores the last N log records in memory, queryable by level and time range, for debugging recent incidents."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
